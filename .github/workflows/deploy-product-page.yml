name: Deploy Product Sales Page

on:
  push:
    branches: [main, claude/kind-faraday-dzu0kd]
    paths:
      - 'product/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy product page to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./product
          destination_dir: product
          keep_files: true
